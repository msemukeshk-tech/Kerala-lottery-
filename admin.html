<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Change WhatsApp Number</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #128C7E; margin-bottom: 20px; font-size: 24px; }
        label { display: block; text-align: left; margin-bottom: 8px; font-weight: bold; color: #333; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; outline: none; transition: 0.3s; margin-bottom: 15px; }
        input[type="text"]:focus { border-color: #25D366; }
        button { width: 100%; background-color: #25D366; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #128C7E; }
        .note { font-size: 12px; color: #666; margin-top: 15px; line-height: 1.4; }
        .current-num { background: #e7f8f2; padding: 10px; border-radius: 6px; margin-bottom: 15px; color: #075e54; font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>WhatsApp Number Admin</h2>
    
    <div class="current-num">
        वर्तमान नंबर: <span id="currentDisplay">लोड हो रहा है...</span>
    </div>

    <label for="waNumber">नया WhatsApp नंबर डालें:</label>
    <input type="text" id="waNumber" placeholder="उदा: 919876543210">

    <button onclick="saveNumber()">नंबर अपडेट करें</button>

    <p class="note">
        <strong>नोट:</strong> कंट्री कोड के साथ नंबर डालें (जैसे भारत के लिए 91 से शुरू करें, बिना + या स्पेस के)।
    </p>
</div>

<script>
    // पहले से सेव नंबर दिखाएं
    window.onload = function() {
        let savedNumber = localStorage.getItem('whatsapp_number') || "अभी कोई नंबर सेट नहीं है";
        document.getElementById('currentDisplay').innerText = savedNumber;
    };

    function saveNumber() {
        let num = document.getElementById('waNumber').value.trim();
        // केवल अंकों को अनुमति दें
        num = num.replace(/\D/g, '');

        if(num.length >= 10) {
            localStorage.setItem('whatsapp_number', num);
            document.getElementById('currentDisplay').innerText = num;
            alert('WhatsApp नंबर सफलतापूर्वक बदल दिया गया है!');
            document.getElementById('waNumber').value = '';
        } else {
            alert('कृपया एक सही WhatsApp नंबर डालें (कम से कम 10 अंक)।');
        }
    }
</script>

</body>
</html>
