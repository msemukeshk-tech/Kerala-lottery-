<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - WhatsApp Number</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #fff3f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; border: 1px solid #ffe3ea; }
        h2 { color: #d9365d; margin-top: 0; font-size: 20px; }
        .status-box { background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 10px; padding: 12px; margin-bottom: 20px; text-align: center; }
        .status-title { font-size: 12px; color: #2e7d32; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .current-number { font-size: 18px; color: #1b5e20; font-weight: bold; }
        label { display: block; text-align: left; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #ff4f79; }
        button { width: 100%; background: linear-gradient(90deg, #ff4f79, #d9365d); color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:active { transform: scale(0.98); }
        .note { font-size: 11px; color: #777; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ Admin Control Panel</h2>

    <div class="status-box">
        <div class="status-title">वर्तमान में सेट व्हाट्सएप नंबर:</div>
        <div class="current-number" id="savedNumDisplay">लोड हो रहा है...</div>
    </div>

    <label for="waNumber">नया WhatsApp नंबर दर्ज करें:</label>
    <input type="text" id="waNumber" placeholder="उदा: 917857807380" maxlength="13">

    <button onclick="saveNumber()">नंबर अपडेट करें</button>

    <p class="note">
        💡 <b>ध्यान दें:</b> नंबर Country Code के साथ लिखें (जैसे भारत के लिए आगे 91 लगाएँ, बिना + या Space के)।
    </p>
</div>

<script>
    // डिफ़ॉल्ट नंबर
    const DEFAULT_NUMBER = "917857807380";

    // पेज लोड होते ही पहले से सेव नंबर दिखाएं
    window.onload = function() {
        let currentNum = localStorage.getItem('whatsapp_number') || DEFAULT_NUMBER;
        document.getElementById('savedNumDisplay').innerText = "+" + currentNum;
    };

    function saveNumber() {
        let numInput = document.getElementById('waNumber').value.trim();
        // केवल नंबर रखें
        let cleanNum = numInput.replace(/\D/g, '');

        if(cleanNum.length >= 10) {
            localStorage.setItem('whatsapp_number', cleanNum);
            document.getElementById('savedNumDisplay').innerText = "+" + cleanNum;
            alert('WhatsApp नंबर सफलतापूर्वक बदल दिया गया है!');
            document.getElementById('waNumber').value = '';
        } else {
            alert('कृपया सही 10 या 12 अंकों का WhatsApp नंबर दर्ज करें।');
        }
    }
</script>

</body>
</html>
